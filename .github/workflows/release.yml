name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-artifacts
          cp StudyCat.apk release-artifacts/StudyCat.apk
          cp StudyCat.apk release-artifacts/StudyCat-${{ github.ref_name }}.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StudyCat-APK
          path: release-artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "StudyCat ${{ github.ref_name }}"
          body: |
            ## 🐱 StudyCat ${{ github.ref_name }}
            
            ¡Versión lista para instalar en Android!
            
            ### ✨ Funcionalidades incluidas
            - ☁️ **Respaldo en la Nube Seguro**: Inicio de sesión con Google (OAuth 2.0 PKCE) o Correo/Contraseña en Supabase (PostgreSQL con Row Level Security y cifrado AndroidKeyStore).
            - ⏱️ **Cronómetro Progresivo**: Registro de tiempo de estudio por materia.
            - 🍅 **Temporizador Pomodoro con Alarmas**: Fases de Enfoque, Descanso Corto y Largo con aviso sonoro y vibración continua.
            - ✏️ **Edición de Materias y Bloques desde el Timeline**: Edita materias o toca cualquier bloque estudiado en el Timeline de 10 minutos para ajustar su tiempo de término o eliminarlo.
            - 🖤 **Modo Pantalla Negra (OLED)**: Máximo ahorro de batería con fondo negro puro `#000000`.
            - 📊 **Timeline de 10 Minutos**: Visualización diaria interactiva dividida en 6 bloques por hora.
            - 🎨 **5 Temas Visuales**: Noche Coral, Gatito Sakura, Papel Estudio, Medianoche y Bosque Matcha.
            - 🔒 **Local-first y 100% Sin Anuncios**: Tu información se almacena localmente y funciona sin conexión a internet.
            
            ### 📲 Instalación
            Descarga el archivo `StudyCat-${{ github.ref_name }}.apk` adjunto abajo e instálalo en tu teléfono.
          files: |
            release-artifacts/StudyCat-${{ github.ref_name }}.apk
            release-artifacts/StudyCat.apk
          draft: false
          prerelease: false
